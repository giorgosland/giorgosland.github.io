<!DOCTYPE html>

<head>

    <title>Γιώργος Λάνδρου - Ψηφιακή Κάρτα</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #2c3e50;
        }
        h1 { margin: 0; font-size: 26px; color: #2c3e50; }
        h2 { margin: 10px 0 30px; font-size: 18px; color: #7f8c8d; font-weight: normal; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin-bottom: 12px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s, transform 0.1s;
            box-sizing: border-box;
        }
        .btn:hover { 
            background-color: #1a252f; 
            transform: translateY(-2px);
        }
        .btn-primary { background-color: #2980b9; }
        .btn-primary:hover { background-color: #1f618d; }
    </style>
</head>
<body>

<div class="card">
